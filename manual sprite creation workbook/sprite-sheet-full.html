<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Sprite Sheet Reference — player-nude</title>
<style>
  @page {
    size: letter;
    margin: 0.5in 0.5in 0.6in 0.75in;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Courier New", monospace;
    width: 8.5in;
    margin: 0 auto;
    padding: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page {
    width: 8.5in;
    min-height: 11in;
    position: relative;
    padding: 0.5in 0.5in 0.5in 0.75in;
  }

  /* Sprite sheet area */
  .sheet-container {
    position: relative;
    width: 7.5in;
    height: 4.2857in;
  }

  .sheet-img {
    width: 100%;
    height: 100%;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }

  .sheet-underdrawing {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .sheet-grid {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  /* Angle labels (left gutter) */
  .al {
    position: absolute;
    left: -0.45in;
    font-size: 5pt;
    font-weight: bold;
    color: #333;
    line-height: 1;
    transform: translateY(-50%);
  }

  /* Column markers (top) */
  .cm {
    position: absolute;
    top: -0.18in;
    font-size: 4pt;
    color: #666;
    transform: translateX(-50%);
  }

  /* Fiducials */
  .fiducial {
    position: absolute;
    width: 0.15in;
    height: 0.15in;
    background: #000;
  }
  .fid-tl { top: 0.425in; left: 0.425in; }
  .fid-tr { top: 0.425in; right: 0.425in; }
  .fid-bl { bottom: 0.425in; left: 0.425in; }
  .fid-br { bottom: 0.425in; right: 0.425in; }

  /* Footer */
  .footer {
    margin-top: 0.15in;
    padding: 0.08in 0;
    border-top: 0.5pt solid #999;
    font-size: 6pt;
    font-family: "Courier New", monospace;
    color: #333;
    display: flex;
    flex-wrap: wrap;
    gap: 0.05in 0.25in;
  }
  .footer .bubble {
    display: inline-block;
    width: 9px;
    height: 9px;
    border: 0.8pt solid #333;
    border-radius: 50%;
    margin: 0 1px;
  }
  .footer .fill {
    border-bottom: 0.5pt solid #999;
    min-width: 1in;
    display: inline-block;
  }

  /* Calibration strip */
  .calibration {
    display: flex;
    gap: 2px;
    align-items: center;
    font-size: 5pt;
    font-family: "Courier New", monospace;
    margin-top: 0.06in;
  }
  .calibration .swatch {
    width: 0.18in;
    height: 0.18in;
    border: 0.3pt solid #999;
  }

  /* Legend */
  .legend {
    font-size: 5pt;
    color: #555;
    margin-top: 0.06in;
    line-height: 1.3;
  }

  @media print {
    body { margin: 0; padding: 0; }
    .page { padding: 0.5in 0.5in 0.5in 0.75in; }
  }
</style>
